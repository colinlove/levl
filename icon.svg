<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
    <radialGradient id="bubble" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="60%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Disc -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#27272a" stroke-width="4"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#27272a" stroke-width="2" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="70" fill="none" stroke="#22c55e" stroke-width="4" opacity="0.6"/>

  <!-- Crosshairs -->
  <line x1="46" y1="256" x2="466" y2="256" stroke="#27272a" stroke-width="2"/>
  <line x1="256" y1="46" x2="256" y2="466" stroke="#27272a" stroke-width="2"/>

  <!-- Center Cross -->
  <line x1="244" y1="256" x2="268" y2="256" stroke="#22c55e" stroke-width="3"/>
  <line x1="256" y1="244" x2="256" y2="268" stroke="#22c55e" stroke-width="3"/>

  <!-- Bubble Level Centered -->
  <circle cx="256" cy="256" r="48" fill="url(#bubble)" filter="url(#glow)"/>
  <ellipse cx="244" cy="244" rx="14" ry="8" transform="rotate(-30 244 244)" fill="#ffffff" opacity="0.8"/>
</svg>